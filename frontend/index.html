<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Carinaa — an explainable, educational RAG document intelligence platform. Every answer, traceable."
    />
    <title>Carinaa — Every Answer, Traceable</title>

    <!--
      PWA identity. These lines plus /public/manifest.webmanifest, the icon
      files and /public/sw.js make Carinaa installable: a browser will offer
      "Install Carinaa", launch it standalone (no address bar), and keep the
      app shell available offline. The manifest and worker are plain files
      copied verbatim into the build, so this works without any PWA plugin -
      keeping the build free of a tool that would otherwise have to be trusted
      about caching. The service worker never caches /api (see public/sw.js).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Carinaa" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carinaa" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Theme bootstrap.

      This runs before React mounts so the correct theme is applied on the very
      first paint. Without it the browser would render one frame of the default
      (light) theme and then flip to dark, which looks like a bug. The value is
      read from the same key the app writes to, so the two never disagree.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("carinaa.theme");
          var resolved;
          if (stored === "light" || stored === "dark") {
            resolved = stored;
          } else {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
